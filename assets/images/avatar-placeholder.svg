<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#090b14" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glowCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="400" height="480" rx="24" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="400" height="480" rx="24" fill="url(#gridPattern)" />
  <rect x="1" y="1" width="398" height="478" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#glowCircle)" />

  <!-- Orbit Rings -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Monogram Avatar Circle (C. Gayathri) -->
  <circle cx="200" cy="180" r="70" fill="#14192a" stroke="url(#avatarGlow)" stroke-width="3" />
  <text x="200" y="196" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-1">CG</text>

  <!-- Active Status Indicator -->
  <circle cx="255" cy="235" r="14" fill="#090a0f" stroke="#10b981" stroke-width="2" />
  <circle cx="255" cy="235" r="7" fill="#10b981" />

  <!-- Code / Role Tags -->
  <g opacity="0.85">
    <rect x="35" y="45" width="115" height="26" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="47" y="62" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">&lt;Developer /&gt;</text>
    
    <rect x="250" y="70" width="115" height="26" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="262" y="87" fill="#38bdf8" font-family="monospace" font-size="11">CS Student 🎓</text>
  </g>

  <!-- Bottom Floating Badge with User Name & Location -->
  <g transform="translate(35, 385)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="330" height="60" rx="14" fill="#161b2c" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <!-- Location Pin / Code Icon -->
    <g transform="translate(18, 18)" fill="none" stroke="#10b981" stroke-width="2">
      <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 14 8 14s8-8.75 8-14a8 8 0 0 0-8-8z"></path>
      <circle cx="12" cy="10" r="3"></circle>
    </g>
    <!-- Text -->
    <text x="52" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">C. Gayathri</text>
    <text x="52" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Coimbatore, Tamil Nadu • Software &amp; AI</text>
  </g>
</svg>
