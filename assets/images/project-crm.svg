<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#0e1320" />
    </linearGradient>
    <linearGradient id="dealCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2438" />
      <stop offset="100%" stop-color="#161c2c" />
    </linearGradient>
  </defs>

  <!-- App Canvas -->
  <rect width="800" height="480" fill="url(#crmBg)" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#111624" stroke="#1f293d" stroke-width="1" />
  <circle cx="30" cy="25" r="8" fill="#10b981" />
  <text x="50" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">PipelineX CRM</text>
  
  <!-- Search bar -->
  <rect x="220" y="12" width="260" height="26" rx="6" fill="#0b0e17" stroke="#1e293b" stroke-width="1" />
  <text x="235" y="29" fill="#64748b" font-family="sans-serif" font-size="11">Search deals, leads, contacts...</text>

  <!-- Pipeline Value Banner -->
  <rect x="520" y="12" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" />
  <text x="532" y="29" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Active: $418,500</text>
  
  <rect x="695" y="12" width="85" height="26" rx="6" fill="#10b981" />
  <text x="707" y="29" fill="#090a0f" font-family="sans-serif" font-size="11" font-weight="bold">+ New Deal</text>

  <!-- Subheader -->
  <g transform="translate(30, 70)">
    <text x="0" y="20" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Q4 Sales Pipeline & Deal Velocity</text>
    <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Automated scoring • Email tracking enabled • 84% close-rate prediction</text>
  </g>

  <!-- Kanban Pipeline Board -->
  <!-- Column 1: Qualified Leads -->
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="170" height="330" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="170" height="36" rx="10" fill="#161e30" />
    <rect x="0" y="26" width="170" height="10" fill="#161e30" />
    <text x="14" y="23" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">LEADS (5)</text>
    <text x="110" y="23" fill="#64748b" font-family="sans-serif" font-size="11">$65k</text>

    <!-- Deal Card 1 -->
    <rect x="10" y="48" width="150" height="75" rx="8" fill="url(#dealCard)" stroke="#222d44" stroke-width="1" />
    <text x="20" y="68" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Starlight Media</text>
    <text x="20" y="85" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">$24,000</text>
    <rect x="20" y="96" width="45" height="16" rx="4" fill="#38bdf8" fill-opacity="0.2" />
    <text x="25" y="108" fill="#38bdf8" font-family="sans-serif" font-size="9">Inbound</text>

    <!-- Deal Card 2 -->
    <rect x="10" y="133" width="150" height="75" rx="8" fill="url(#dealCard)" stroke="#222d44" stroke-width="1" />
    <text x="20" y="153" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Apex Logistics</text>
    <text x="20" y="170" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">$41,000</text>
    <rect x="20" y="181" width="55" height="16" rx="4" fill="#a855f7" fill-opacity="0.2" />
    <text x="25" y="193" fill="#c084fc" font-family="sans-serif" font-size="9">Outreach</text>
  </g>

  <!-- Column 2: Demo / Contacted -->
  <g transform="translate(220, 125)">
    <rect x="0" y="0" width="170" height="330" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="170" height="36" rx="10" fill="#161e30" />
    <rect x="0" y="26" width="170" height="10" fill="#161e30" />
    <text x="14" y="23" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">CONTACTED (3)</text>
    <text x="110" y="23" fill="#64748b" font-family="sans-serif" font-size="11">$98k</text>

    <!-- Deal Card 1 -->
    <rect x="10" y="48" width="150" height="85" rx="8" fill="url(#dealCard)" stroke="#222d44" stroke-width="1" />
    <text x="20" y="68" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Omni Corp Tech</text>
    <text x="20" y="85" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">$58,000</text>
    <text x="20" y="103" fill="#94a3b8" font-family="sans-serif" font-size="10">Demo scheduled 2pm</text>
    <circle cx="140" cy="65" r="4" fill="#10b981" />
  </g>

  <!-- Column 3: Proposal Sent -->
  <g transform="translate(410, 125)">
    <rect x="0" y="0" width="170" height="330" rx="10" fill="url(#columnGrad)" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="170" height="36" rx="10" fill="#161e30" />
    <rect x="0" y="26" width="170" height="10" fill="#161e30" />
    <text x="14" y="23" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">PROPOSAL (2)</text>
    <text x="110" y="23" fill="#64748b" font-family="sans-serif" font-size="11">$145k</text>

    <!-- Deal Card 1 -->
    <rect x="10" y="48" width="150" height="90" rx="8" fill="url(#dealCard)" stroke="#0284c7" stroke-width="1.5" />
    <text x="20" y="68" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Horizon Health</text>
    <text x="20" y="86" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">$85,000</text>
    <text x="20" y="105" fill="#38bdf8" font-family="sans-serif" font-size="10">Contract under review</text>
    <rect x="20" y="115" width="60" height="14" rx="3" fill="#0284c7" fill-opacity="0.3" />
    <text x="24" y="125" fill="#38bdf8" font-family="sans-serif" font-size="8.5">Legal review</text>
  </g>

  <!-- Column 4: Won Deals -->
  <g transform="translate(600, 125)">
    <rect x="0" y="0" width="170" height="330" rx="10" fill="url(#columnGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="170" height="36" rx="10" fill="#064e3b" fill-opacity="0.5" />
    <rect x="0" y="26" width="170" height="10" fill="#064e3b" fill-opacity="0.5" />
    <text x="14" y="23" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">WON (4)</text>
    <text x="110" y="23" fill="#10b981" font-family="sans-serif" font-size="11">$110.5k</text>

    <!-- Deal Card 1 -->
    <rect x="10" y="48" width="150" height="80" rx="8" fill="url(#dealCard)" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="68" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Delta Dynamics</text>
    <text x="20" y="86" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">$62,500</text>
    <rect x="20" y="98" width="65" height="18" rx="4" fill="#10b981" fill-opacity="0.25" />
    <text x="27" y="111" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">CLOSED WON</text>
  </g>
</svg>
