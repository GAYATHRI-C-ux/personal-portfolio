<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="100" x2="800" y2="100" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Top label bar -->
  <rect x="0" y="0" width="800" height="44" fill="rgba(255,255,255,0.03)" rx="0"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8"/>
  <text x="100" y="27" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.3)">InternshipSystem.java</text>

  <!-- Main title -->
  <text x="50" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Student Internship System</text>
  <text x="50" y="115" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)">Java OOP • Class &amp; Objects • Scanner • Conditional Logic</text>

  <!-- Left Panel: Application Form -->
  <rect x="50" y="135" width="310" height="220" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <text x="70" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="1">STUDENT APPLICATION</text>

  <!-- Name field -->
  <rect x="70" y="172" width="270" height="34" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="83" y="185" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.3)">Student Name</text>
  <text x="83" y="199" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Gayathri C</text>

  <!-- Company field -->
  <rect x="70" y="214" width="270" height="34" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="83" y="227" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.3)">Company Name</text>
  <text x="83" y="241" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">TCS</text>

  <!-- Role field -->
  <rect x="70" y="256" width="270" height="34" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="83" y="269" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.3)">Role</text>
  <text x="83" y="283" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Software Developer</text>

  <!-- Status badge -->
  <rect x="70" y="298" width="270" height="34" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="83" y="311" font-family="monospace" font-size="9" fill="rgba(16,185,129,0.7)">Application Status</text>
  <circle cx="270" cy="315" r="5" fill="#10b981" opacity="0.9"/>
  <text x="83" y="325" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981">APPROVED</text>

  <!-- Submit button -->
  <rect x="70" y="338" width="130" height="30" rx="6" fill="rgba(255,255,255,0.9)"/>
  <text x="135" y="358" font-family="sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="middle">Submit Application</text>

  <!-- Right Panel: Admin Review -->
  <rect x="390" y="135" width="360" height="220" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <text x="410" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.4)" letter-spacing="1">ADMIN REVIEW PANEL</text>

  <!-- Review card -->
  <rect x="410" y="172" width="320" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="424" y="194" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">Name    :</text>
  <text x="495" y="194" font-family="sans-serif" font-size="11" fill="#f8fafc">Gayathri C</text>
  <text x="424" y="213" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">Company :</text>
  <text x="495" y="213" font-family="sans-serif" font-size="11" fill="#f8fafc">TCS</text>
  <text x="424" y="232" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">Role    :</text>
  <text x="495" y="232" font-family="sans-serif" font-size="11" fill="#f8fafc">Software Developer</text>
  <text x="424" y="251" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">Status  :</text>
  <text x="495" y="251" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Pending</text>

  <!-- Approve button -->
  <rect x="410" y="276" width="148" height="36" rx="8" fill="url(#green)"/>
  <text x="484" y="299" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓ Approve</text>

  <!-- Reject button -->
  <rect x="572" y="276" width="148" height="36" rx="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="646" y="299" font-family="sans-serif" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">✗ Reject</text>

  <!-- Final status box -->
  <rect x="410" y="326" width="310" height="26" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="565" y="344" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Final Status: APPROVED ✓</text>

  <!-- Bottom code strip -->
  <rect x="50" y="378" width="700" height="80" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="70" y="400" font-family="monospace" font-size="10" fill="rgba(245,158,11,0.7)">class</text>
  <text x="104" y="400" font-family="monospace" font-size="10" fill="#f8fafc">Internship {</text>
  <text x="80" y="416" font-family="monospace" font-size="10" fill="rgba(139,92,246,0.8)">String</text>
  <text x="120" y="416" font-family="monospace" font-size="10" fill="#f8fafc">name, company, role, status;</text>
  <text x="70" y="432" font-family="monospace" font-size="10" fill="#f8fafc">}  </text>
  <text x="120" y="432" font-family="monospace" font-size="10" fill="rgba(245,158,11,0.7)">if</text>
  <text x="138" y="432" font-family="monospace" font-size="10" fill="#f8fafc">(choice == 1) s.status =</text>
  <text x="350" y="432" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.8)">"Approved"</text>
  <text x="432" y="432" font-family="monospace" font-size="10" fill="#f8fafc">;</text>
  <text x="70" y="448" font-family="monospace" font-size="10" fill="rgba(245,158,11,0.7)">else</text>
  <text x="106" y="448" font-family="monospace" font-size="10" fill="#f8fafc">s.status =</text>
  <text x="194" y="448" font-family="monospace" font-size="10" fill="rgba(239,68,68,0.8)">"Rejected"</text>
  <text x="270" y="448" font-family="monospace" font-size="10" fill="#f8fafc">;</text>

  <!-- Tech badge row -->
  <rect x="50" y="470" width="56" height="20" rx="10" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="78" y="484" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Java</text>
  <rect x="114" y="470" width="38" height="20" rx="10" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="133" y="484" font-family="monospace" font-size="9" fill="#8b5cf6" text-anchor="middle">OOP</text>
  <rect x="160" y="470" width="68" height="20" rx="10" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="194" y="484" font-family="monospace" font-size="9" fill="#3b82f6" text-anchor="middle">Scanner I/O</text>
  <rect x="236" y="470" width="88" height="20" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="280" y="484" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Class &amp; Objects</text>
</svg>
