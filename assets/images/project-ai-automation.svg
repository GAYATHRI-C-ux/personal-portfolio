<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2d" />
      <stop offset="100%" stop-color="#101524" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#aiBg)" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#101420" stroke="#1c2538" stroke-width="1" />
  <circle cx="35" cy="25" r="9" fill="#10b981" />
  <text x="56" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">AutoFlow AI • Multi-Agent Pipeline</text>
  <rect x="630" y="13" width="135" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <circle cx="645" cy="25" r="4" fill="#10b981" />
  <text x="656" y="29" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Active (99.98% Uptime)</text>

  <!-- Canvas Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" />
    </pattern>
    <rect width="800" height="480" fill="url(#dotGrid)" />
  </g>

  <!-- Connective Piping Lines -->
  <!-- Line 1 to Line 2 -->
  <path d="M 195 240 L 290 240" fill="none" stroke="url(#glowLine)" stroke-width="2.5" stroke-dasharray="6 3" />
  <!-- Line 2 to 3 (split) -->
  <path d="M 450 240 L 530 170" fill="none" stroke="url(#glowLine)" stroke-width="2.5" />
  <path d="M 450 240 L 530 310" fill="none" stroke="url(#glowLine)" stroke-width="2.5" />
  <!-- Line 3 to 4 -->
  <path d="M 680 170 L 720 170" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 680 310 L 720 310" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- Node 1: Ingestion & Webhook Trigger -->
  <g transform="translate(45, 175)">
    <rect x="0" y="0" width="150" height="130" rx="12" fill="url(#nodeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="34" rx="12" fill="#172033" />
    <rect x="0" y="24" width="150" height="10" fill="#172033" />
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">01 • INGESTION</text>
    <text x="14" y="55" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Multi-Channel Inflow</text>
    <text x="14" y="73" fill="#94a3b8" font-family="sans-serif" font-size="10">• Invoices (PDF/Scan)</text>
    <text x="14" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10">• Customer Inquiries</text>
    <text x="14" y="107" fill="#94a3b8" font-family="sans-serif" font-size="10">• Webhook Payload</text>
    <circle cx="150" cy="65" r="5" fill="#38bdf8" />
  </g>

  <!-- Node 2: LLM Agent & Document Understanding -->
  <g transform="translate(290, 160)">
    <rect x="0" y="0" width="160" height="160" rx="12" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="160" height="34" rx="12" fill="#064e3b" fill-opacity="0.4" />
    <rect x="0" y="24" width="160" height="10" fill="#064e3b" fill-opacity="0.4" />
    <text x="14" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">02 • AI CORE AGENT</text>
    <circle cx="0" cy="80" r="5" fill="#38bdf8" />
    <text x="14" y="55" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">LLM Processing</text>
    <text x="14" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">• Schema Extraction</text>
    <text x="14" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">• Sentiment & Priority</text>
    <text x="14" y="109" fill="#94a3b8" font-family="sans-serif" font-size="10">• Anomaly Check</text>
    <!-- Latency Badge -->
    <rect x="14" y="123" width="132" height="24" rx="6" fill="#090d16" stroke="#1f293d" stroke-width="1" />
    <text x="24" y="139" fill="#10b981" font-family="monospace" font-size="10.5">Latency: 280ms</text>
    <circle cx="160" cy="80" r="5" fill="#10b981" />
  </g>

  <!-- Node 3A: ERP & Database Sync -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="150" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#172033" />
    <rect x="0" y="20" width="150" height="10" fill="#172033" />
    <text x="12" y="20" fill="#a855f7" font-family="sans-serif" font-size="10.5" font-weight="bold">03A • DB RECORD</text>
    <circle cx="0" cy="60" r="5" fill="#10b981" />
    <text x="12" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="600">PostgreSQL / CRM</text>
    <text x="12" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Auto-created ledger</text>
    <text x="12" y="85" fill="#10b981" font-family="sans-serif" font-size="10">✓ Reconciled</text>
  </g>

  <!-- Node 3B: Automated Communication Dispatch -->
  <g transform="translate(530, 255)">
    <rect x="0" y="0" width="150" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#172033" />
    <rect x="0" y="20" width="150" height="10" fill="#172033" />
    <text x="12" y="20" fill="#f59e0b" font-family="sans-serif" font-size="10.5" font-weight="bold">03B • DISPATCH</text>
    <circle cx="0" cy="55" r="5" fill="#10b981" />
    <text x="12" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="600">Email & Slack Alert</text>
    <text x="12" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">Instant confirmation</text>
    <text x="12" y="85" fill="#10b981" font-family="sans-serif" font-size="10">✓ Sent (0 human effort)</text>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(45, 415)">
    <rect x="0" y="0" width="710" height="42" rx="8" fill="#111624" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12">Measurable Impact:</text>
    <text x="160" y="26" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">85% Labor Hours Saved</text>
    <text x="360" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">0% Extraction Error Rate</text>
    <text x="560" y="26" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">24/7 Zero Latency</text>
  </g>
</svg>
