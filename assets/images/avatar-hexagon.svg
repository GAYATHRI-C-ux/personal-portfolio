<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" width="520" height="540">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="hexClip">
      <polygon points="260,35 445,142 445,358 260,465 75,358 75,142" />
    </clipPath>
  </defs>

  <!-- Ambient Glow Behind Hexagon -->
  <polygon points="260,35 445,142 445,358 260,465 75,358 75,142" fill="none" stroke="#00f0ff" stroke-width="18" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Hexagon Photo Container (Clipped) -->
  <g clip-path="url(#hexClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="520" height="540" fill="url(#avatarBgGrad)" />
    
    <!-- Subtle Tech Circuit Grid -->
    <g opacity="0.08" stroke="#00f0ff" stroke-width="1.5">
      <line x1="0" y1="100" x2="520" y2="100" />
      <line x1="0" y1="200" x2="520" y2="200" />
      <line x1="0" y1="300" x2="520" y2="300" />
      <line x1="0" y1="400" x2="520" y2="400" />
      <line x1="130" y1="0" x2="130" y2="540" />
      <line x1="260" y1="0" x2="260" y2="540" />
      <line x1="390" y1="0" x2="390" y2="540" />
    </g>

    <!-- Radial Glow Circle -->
    <circle cx="260" cy="240" r="130" fill="#00f0ff" opacity="0.12" />

    <!-- Stylized Modern Tech Avatar Silhouette -->
    <g fill="#1b2438" stroke="rgba(255,255,255,0.12)" stroke-width="2">
      <!-- Shoulders / Torso -->
      <path d="M140 460 C140 370, 180 340, 260 340 C340 340, 380 370, 380 460 Z" fill="#141c2e" />
      <!-- High Collar / Blazer -->
      <path d="M220 340 L260 400 L300 340 Z" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="2" />
      <!-- Head Base -->
      <circle cx="260" cy="235" r="72" fill="#202c44" stroke="rgba(0,240,255,0.3)" />
      <!-- Stylized Hair -->
      <path d="M190 230 C190 160, 220 150, 260 150 C300 150, 330 160, 330 230 C310 180, 210 180, 190 230 Z" fill="#0c111e" />
    </g>

    <!-- CG Monogram Badge at Center -->
    <circle cx="260" cy="235" r="42" fill="#0b0f19" stroke="url(#cyanGrad)" stroke-width="3" />
    <text x="260" y="249" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-1">CG</text>

    <!-- Floating Code Pill inside Hexagon -->
    <g transform="translate(185, 395)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#080c16" stroke="#00f0ff" stroke-width="1.5" />
      <text x="75" y="20" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;IT DEVELOPER /&gt;</text>
    </g>
  </g>

  <!-- Thick Neon Accent Hexagon Border -->
  <polygon points="260,35 445,142 445,358 260,465 75,358 75,142" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linejoin="round" />

  <!-- Outer Cyber Bracket Notches (Matching Reference Design) -->
  <!-- Top Left Bracket -->
  <path d="M 52 142 L 52 110 L 80 94" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Left Bracket -->
  <path d="M 52 358 L 52 390 L 80 406" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top Right Bracket -->
  <path d="M 468 142 L 468 110 L 440 94" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Right Bracket -->
  <path d="M 468 358 L 468 390 L 440 406" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Floating Info Tag -->
  <g transform="translate(140, 485)">
    <rect x="0" y="0" width="240" height="40" rx="10" fill="#0e1424" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#00f0ff" />
    <text x="35" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">GAYATHRI C • Coimbatore</text>
  </g>
</svg>
