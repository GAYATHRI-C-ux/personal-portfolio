<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="cardGradPortal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a2a" />
      <stop offset="100%" stop-color="#0e1320" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#portalBg)" />

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="800" height="48" fill="#111624" stroke="#1c2538" stroke-width="1" />
  <circle cx="28" cy="24" r="8" fill="#10b981" />
  <text x="46" y="29" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">EduTrack • Student Academic &amp; Attendance Portal</text>
  <rect x="630" y="11" width="140" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="642" y="28" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Roll No: 22CS084 • Sem 6</text>

  <!-- Left Column: Attendance Gauge & Quick Stats -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="220" height="385" rx="12" fill="url(#cardGradPortal)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Attendance Status</text>

    <!-- Circular Progress Gauge -->
    <g transform="translate(110, 110)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#1e293b" stroke-width="10" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="345" stroke-dashoffset="40" stroke-linecap="round" transform="rotate(-90)" />
      <text x="0" y="8" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">88.5%</text>
      <text x="0" y="25" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ELIGIBLE</text>
    </g>

    <text x="20" y="195" fill="#94a3b8" font-family="sans-serif" font-size="11">Minimum Requirement: 75%</text>
    <text x="20" y="215" fill="#64748b" font-family="sans-serif" font-size="11">Classes Attended: 182 / 205</text>

    <line x1="20" y1="230" x2="200" y2="230" stroke="#1e293b" />

    <!-- Current CGPA -->
    <text x="20" y="255" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Cumulative GPA (CGPA)</text>
    <text x="20" y="290" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">8.72 <tspan fill="#64748b" font-size="13">/ 10</tspan></text>
    <text x="20" y="315" fill="#94a3b8" font-family="sans-serif" font-size="11">Rank: Top 5% in Department</text>

    <rect x="20" y="335" width="180" height="34" rx="6" fill="#10b981" />
    <text x="45" y="356" fill="#090a0f" font-family="sans-serif" font-size="11" font-weight="bold">Apply for Leave / OD</text>
  </g>

  <!-- Right: Subject Scores & Attendance Table -->
  <g transform="translate(270, 68)">
    <rect x="0" y="0" width="500" height="385" rx="12" fill="url(#cardGradPortal)" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Current Semester Subject Roster &amp; Grades</text>
    <text x="410" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Updated Today</text>

    <!-- Table Header -->
    <rect x="20" y="52" width="460" height="30" rx="6" fill="#0a0d16" />
    <text x="35" y="72" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold">CODE</text>
    <text x="100" y="72" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold">COURSE TITLE</text>
    <text x="270" y="72" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold">ATTENDANCE</text>
    <text x="375" y="72" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold">INTERNAL</text>
    <text x="445" y="72" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold">GRADE</text>

    <!-- Row 1 -->
    <g transform="translate(20, 95)">
      <line x1="0" y1="36" x2="460" y2="36" stroke="#1a2336" />
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11">CS601</text>
      <text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Database Management Systems</text>
      <text x="255" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">92%</text>
      <text x="360" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11">48 / 50</text>
      <text x="430" y="22" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">O</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 145)">
      <line x1="0" y1="36" x2="460" y2="36" stroke="#1a2336" />
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11">CS602</text>
      <text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Full-Stack Web Development</text>
      <text x="255" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">95%</text>
      <text x="360" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11">50 / 50</text>
      <text x="430" y="22" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">O</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 195)">
      <line x1="0" y1="36" x2="460" y2="36" stroke="#1a2336" />
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11">CS603</text>
      <text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Artificial Intelligence &amp; ML</text>
      <text x="255" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">86%</text>
      <text x="360" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11">44 / 50</text>
      <text x="430" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">A+</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(20, 245)">
      <line x1="0" y1="36" x2="460" y2="36" stroke="#1a2336" />
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11">CS604</text>
      <text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Computer Networks</text>
      <text x="255" y="22" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">81%</text>
      <text x="360" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11">42 / 50</text>
      <text x="430" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">A+</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(20, 295)">
      <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="11">CS608</text>
      <text x="80" y="22" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Cloud Computing Lab</text>
      <text x="255" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">96%</text>
      <text x="360" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11">49 / 50</text>
      <text x="430" y="22" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">O</text>
    </g>
  </g>
</svg>
