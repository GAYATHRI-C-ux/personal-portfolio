<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#0f1523" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#corpBg)" />

  <!-- Browser Frame -->
  <rect x="30" y="30" width="740" height="420" rx="14" fill="#0d111a" stroke="#1f293d" stroke-width="2" />
  
  <!-- Browser Chrome Top -->
  <rect x="30" y="30" width="740" height="42" rx="14" fill="#131926" />
  <rect x="30" y="58" width="740" height="14" fill="#131926" />
  <circle cx="55" cy="51" r="5" fill="#ef4444" />
  <circle cx="73" cy="51" r="5" fill="#f59e0b" />
  <circle cx="91" cy="51" r="5" fill="#10b981" />

  <!-- Address Bar -->
  <rect x="120" y="40" width="450" height="22" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  <text x="140" y="55" fill="#10b981" font-family="monospace" font-size="11">https://</text>
  <text x="195" y="55" fill="#94a3b8" font-family="monospace" font-size="11">enterprise-platform.client.com</text>

  <!-- Website Nav Header Inside Browser -->
  <rect x="30" y="72" width="740" height="50" fill="#0f1422" />
  <circle cx="70" cy="97" r="10" fill="#10b981" />
  <text x="90" y="102" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">AURA TECH</text>
  <text x="450" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12">Solutions</text>
  <text x="530" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12">Case Studies</text>
  <text x="630" y="102" fill="#94a3b8" font-family="sans-serif" font-size="12">Pricing</text>
  <rect x="690" y="84" width="60" height="26" rx="6" fill="#10b981" />
  <text x="704" y="101" fill="#090a0f" font-family="sans-serif" font-size="11" font-weight="bold">Book</text>

  <!-- Website Hero Section -->
  <g transform="translate(60, 145)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="12" y="16" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Enterprise Digital Infrastructure</text>

    <!-- Main Title -->
    <text x="0" y="60" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">Accelerating Scalable Growth</text>
    <text x="0" y="95" fill="url(#heroGrad)" font-family="sans-serif" font-size="28" font-weight="bold">With Next-Gen Web Solutions</text>

    <!-- Subtitle -->
    <text x="0" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">High performance, headless architecture delivering 99+ Google Lighthouse score,</text>
    <text x="0" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">sub-second page loads, and seamless CRM integrations.</text>

    <!-- CTAs -->
    <rect x="0" y="175" width="130" height="38" rx="8" fill="#10b981" />
    <text x="24" y="199" fill="#090a0f" font-family="sans-serif" font-size="13" font-weight="bold">Get Started →</text>

    <rect x="145" y="175" width="115" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="165" y="199" fill="#e2e8f0" font-family="sans-serif" font-size="13">Live Demo</text>
  </g>

  <!-- Hero Visual / Floating Tech Cards (Right side) -->
  <g transform="translate(480, 155)">
    <!-- Main Floating Card -->
    <rect x="0" y="0" width="260" height="180" rx="12" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Performance Benchmark</text>
    <text x="200" y="30" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">100/100</text>
    
    <!-- Mini Metric Bars -->
    <text x="20" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Page Speed (LCP: 0.4s)</text>
    <rect x="20" y="73" width="220" height="6" rx="3" fill="#1f293d" />
    <rect x="20" y="73" width="215" height="6" rx="3" fill="#10b981" />

    <text x="20" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10">SEO & Accessibility</text>
    <rect x="20" y="113" width="220" height="6" rx="3" fill="#1f293d" />
    <rect x="20" y="113" width="220" height="6" rx="3" fill="#38bdf8" />

    <text x="20" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10">Conversion Uplift</text>
    <rect x="20" y="153" width="220" height="6" rx="3" fill="#1f293d" />
    <rect x="20" y="153" width="185" height="6" rx="3" fill="#8b5cf6" />
  </g>

  <!-- Bottom Metric Strip inside site -->
  <g transform="translate(60, 395)">
    <text x="0" y="20" fill="#64748b" font-family="sans-serif" font-size="11">TRUSTED BY 50+ MODERN COMPANIES</text>
    <text x="260" y="20" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">ACME CORP</text>
    <text x="370" y="20" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">NEXUS LABS</text>
    <text x="480" y="20" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">SYNAPSE AI</text>
    <text x="590" y="20" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">VANGUARD</text>
  </g>
</svg>
