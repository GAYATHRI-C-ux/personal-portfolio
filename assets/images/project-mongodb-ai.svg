<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="lightBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="connLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="cardShadowLight2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#lightBg2)" />

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="90" y="9" width="340" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="105" y="25" fill="#64748b" font-family="monospace" font-size="11">mongo-ai.atlas/vector-search/pipeline</text>

  <rect x="635" y="9" width="140" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1" />
  <text x="650" y="25" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="700">MongoDB Atlas Active</text>

  <!-- Connective Piping Lines -->
  <path d="M 185 240 L 290 240" fill="none" stroke="url(#connLine)" stroke-width="3" stroke-dasharray="6 3" />
  <path d="M 445 240 L 530 170" fill="none" stroke="url(#connLine)" stroke-width="3" />
  <path d="M 445 240 L 530 310" fill="none" stroke="url(#connLine)" stroke-width="3" />

  <!-- Node 1: Inbound Text & Vectorization -->
  <g transform="translate(35, 170)">
    <rect x="0" y="0" width="150" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadowLight2)" />
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="150" height="10" fill="#f1f5f9" />
    <text x="14" y="22" fill="#0284c7" font-family="sans-serif" font-size="10.5" font-weight="800">01 • EMBEDDINGS</text>
    <text x="14" y="55" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">User Query Input</text>
    <text x="14" y="75" fill="#64748b" font-family="sans-serif" font-size="10">• Text Vectorization</text>
    <text x="14" y="92" fill="#64748b" font-family="sans-serif" font-size="10">• 1536-dim Embedding</text>
    <text x="14" y="112" fill="#0284c7" font-family="monospace" font-size="9.5">float[] cosine</text>
    <circle cx="150" cy="70" r="5" fill="#0284c7" />
  </g>

  <!-- Node 2: MongoDB Atlas Vector Search (Core Node) -->
  <g transform="translate(290, 145)">
    <rect x="0" y="0" width="155" height="190" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#cardShadowLight2)" />
    <rect x="0" y="0" width="155" height="34" rx="10" fill="#ecfdf5" />
    <rect x="0" y="24" width="155" height="10" fill="#ecfdf5" />
    <text x="14" y="22" fill="#059669" font-family="sans-serif" font-size="10.5" font-weight="800">02 • MONGODB ATLAS</text>
    <circle cx="0" cy="95" r="5" fill="#0284c7" />
    <text x="14" y="56" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">Vector Search Index</text>
    <text x="14" y="78" fill="#64748b" font-family="sans-serif" font-size="10">• HNSW Indexing</text>
    <text x="14" y="95" fill="#64748b" font-family="sans-serif" font-size="10">• K-Nearest Neighbors</text>
    <text x="14" y="112" fill="#64748b" font-family="sans-serif" font-size="10">• Semantic Retrieval</text>
    <rect x="14" y="130" width="127" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="24" y="147" fill="#15803d" font-family="monospace" font-size="10" font-weight="700">Similarity: 0.98</text>
    <circle cx="155" cy="95" r="5" fill="#10b981" />
  </g>

  <!-- Node 3A: RAG Context Augmentation -->
  <g transform="translate(530, 105)">
    <rect x="0" y="0" width="155" height="115" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadowLight2)" />
    <rect x="0" y="0" width="155" height="30" rx="10" fill="#f1f5f9" />
    <rect x="0" y="20" width="155" height="10" fill="#f1f5f9" />
    <text x="12" y="20" fill="#6366f1" font-family="sans-serif" font-size="10" font-weight="800">03A • RAG PIPELINE</text>
    <circle cx="0" cy="65" r="5" fill="#10b981" />
    <text x="12" y="52" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="700">Context Augmentation</text>
    <text x="12" y="72" fill="#64748b" font-family="sans-serif" font-size="10">Injects retrieved context</text>
    <text x="12" y="90" fill="#059669" font-family="sans-serif" font-size="10" font-weight="700">✓ Grounded Facts</text>
  </g>

  <!-- Node 3B: AI Agent Execution -->
  <g transform="translate(530, 255)">
    <rect x="0" y="0" width="155" height="115" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadowLight2)" />
    <rect x="0" y="0" width="155" height="30" rx="10" fill="#f1f5f9" />
    <rect x="0" y="20" width="155" height="10" fill="#f1f5f9" />
    <text x="12" y="20" fill="#0284c7" font-family="sans-serif" font-size="10" font-weight="800">03B • AI AGENTS</text>
    <circle cx="0" cy="55" r="5" fill="#10b981" />
    <text x="12" y="52" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="700">Autonomous Agent</text>
    <text x="12" y="72" fill="#64748b" font-family="sans-serif" font-size="10">Tool calling &amp; decision</text>
    <text x="12" y="90" fill="#0284c7" font-family="sans-serif" font-size="10" font-weight="700">✓ Execution verified</text>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(35, 410)">
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadowLight2)" />
    <text x="20" y="26" fill="#64748b" font-family="sans-serif" font-size="11.5">MongoDB Vector Certified:</text>
    <text x="180" y="26" fill="#0284c7" font-family="sans-serif" font-size="11.5" font-weight="700">Zero Hallucination Grounding</text>
    <text x="400" y="26" fill="#059669" font-family="sans-serif" font-size="11.5" font-weight="700">Sub-50ms Vector Retrieval</text>
    <text x="600" y="26" fill="#6366f1" font-family="sans-serif" font-size="11.5" font-weight="700">Multi-Agent Ready</text>
  </g>
</svg>
