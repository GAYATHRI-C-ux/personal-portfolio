      <text x="46" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Mechanical Keycaps</text>
      <text x="46" y="30" fill="#0284c7" font-family="sans-serif" font-size="11">₹600 × 1</text>
    </g>

    <g transform="translate(16, 190)">
      <line x1="0" y1="0" x2="198" y2="0" stroke="#e2e8f0" />
      <text x="0" y="22" fill="#64748b" font-family="sans-serif" font-size="11">Subtotal:</text>
      <text x="145" y="22" fill="#0f172a" font-family="sans-serif" font-size="11">₹2,499</text>

      <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Delivery:</text>
      <text x="155" y="42" fill="#16a34a" font-family="sans-serif" font-size="11">FREE</text>

      <text x="0" y="70" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="800">Total Amount:</text>
      <text x="135" y="70" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="800">₹2,499</text>
