<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="lightBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="cardShadowLight3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#lightBg3)" />

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="90" y="9" width="340" height="24" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="105" y="25" fill="#64748b" font-family="monospace" font-size="11">trendstore.dev/products?category=audio</text>

  <rect x="640" y="9" width="135" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="655" y="25" fill="#16a34a" font-family="sans-serif" font-size="11" font-weight="700">🛒 Cart (3 Items) • ₹2,499</text>

  <!-- Store Header Strip -->
  <g transform="translate(30, 56)">
    <text x="0" y="22" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">TRENDSTORE<tspan fill="#0284c7">.</tspan></text>
    
    <rect x="180" y="2" width="70" height="26" rx="13" fill="#0f172a" />
    <text x="195" y="19" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">All Tech</text>

    <rect x="260" y="2" width="90" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="275" y="19" fill="#475569" font-family="sans-serif" font-size="11">Audio Gear</text>

    <rect x="360" y="2" width="80" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="375" y="19" fill="#475569" font-family="sans-serif" font-size="11">Wearables</text>

    <text x="630" y="20" fill="#64748b" font-family="sans-serif" font-size="11">Sort: Price Low → High ▾</text>
  </g>

  <!-- Product 1 -->
  <g transform="translate(30, 105)">
    <rect x="0" y="0" width="225" height="345" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadowLight3)" />
    <rect x="12" y="12" width="201" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="112" cy="85" r="35" fill="#e2e8f0" />
    <path d="M 95 85 C 95 72, 130 72, 130 85" fill="none" stroke="#0284c7" stroke-width="3" />
    <rect x="88" y="80" width="14" height="22" rx="4" fill="#38bdf8" />
    <rect x="123" y="80" width="14" height="22" rx="4" fill="#38bdf8" />
    <text x="24" y="32" fill="#0284c7" font-family="sans-serif" font-size="9" font-weight="800">BESTSELLER</text>

    <text x="14" y="185" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">Wireless Noise Cancelling</text>
    <text x="14" y="202" fill="#64748b" font-family="sans-serif" font-size="11">Bluetooth 5.3 • 40hr Battery</text>
    <text x="14" y="228" fill="#f59e0b" font-family="sans-serif" font-size="12">★★★★☆ <tspan fill="#94a3b8" font-size="10">(142)</tspan></text>
    
    <text x="14" y="260" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">₹1,899</text>
    <text x="85" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12" text-decoration="line-through">₹3,499</text>

    <rect x="14" y="285" width="197" height="36" rx="6" fill="#0f172a" />
    <text x="75" y="308" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Add to Cart</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(285, 105)">
    <rect x="0" y="0" width="225" height="345" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadowLight3)" />
    <rect x="12" y="12" width="201" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="112" cy="85" r="30" fill="#e2e8f0" stroke="#6366f1" stroke-width="2" />
    <rect x="100" y="45" width="24" height="80" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 2" />
