    <text x="14" y="185" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">Smart Fitness Tracker Pro</text>
    <text x="14" y="202" fill="#64748b" font-family="sans-serif" font-size="11">SpO2 • AMOLED Display</text>
    <text x="14" y="228" fill="#f59e0b" font-family="sans-serif" font-size="12">★★★★★ <tspan fill="#94a3b8" font-size="10">(89)</tspan></text>
    
    <text x="14" y="260" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">₹2,499</text>
    <text x="85" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12" text-decoration="line-through">₹4,999</text>

    <rect x="14" y="285" width="197" height="36" rx="6" fill="#0f172a" />
    <text x="75" y="308" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Add to Cart</text>
  </g>

  <!-- Cart Summary Panel -->
  <g transform="translate(540, 105)">
    <rect x="0" y="0" width="230" height="345" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadowLight3)" />
    <text x="16" y="28" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="800">Shopping Cart (3)</text>
    <line x1="16" y1="42" x2="214" y2="42" stroke="#e2e8f0" />

    <g transform="translate(16, 55)">
