<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="100%" stop-color="#121724" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect width="800" height="480" fill="url(#clinicBg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
  </g>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#131926" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="95" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">MediFlow Portal • Clinic Operating System</text>

  <!-- Sidebar -->
  <rect x="0" y="42" width="180" height="438" fill="#111622" />
  <rect x="20" y="70" width="140" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="50" y="91" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">Appointments</text>
  <circle cx="34" cy="86" r="4" fill="#10b981" />

  <text x="50" y="135" fill="#64748b" font-family="sans-serif" font-size="12">Patient Records</text>
  <text x="50" y="175" fill="#64748b" font-family="sans-serif" font-size="12">Doctors & Staff</text>
  <text x="50" y="215" fill="#64748b" font-family="sans-serif" font-size="12">Prescriptions</text>
  <text x="50" y="255" fill="#64748b" font-family="sans-serif" font-size="12">Billing & Claims</text>
  <text x="50" y="295" fill="#64748b" font-family="sans-serif" font-size="12">SMS Reminders</text>

  <!-- Main Content Area -->
  <!-- Top Stat Cards -->
  <g transform="translate(205, 60)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Today's Visits</text>
    <text x="16" y="60" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">42</text>
    <rect x="110" y="16" width="54" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
    <text x="120" y="30" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">+18%</text>

    <!-- Card 2 -->
    <rect x="195" y="0" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="211" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Doctors</text>
    <text x="211" y="60" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">8 / 10</text>
    <circle cx="340" cy="24" r="5" fill="#10b981" />

    <!-- Card 3 -->
    <rect x="390" y="0" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="406" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Automated Reminders</text>
    <text x="406" y="60" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold">98.4%</text>
    <text x="495" y="60" fill="#38bdf8" font-family="sans-serif" font-size="10">Sent via SMS</text>
  </g>

  <!-- Patient Queue / Appointment Schedule Table -->
  <g transform="translate(205, 165)">
    <rect x="0" y="0" width="570" height="295" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Live Consultation Schedule</text>
    <text x="480" y="32" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Auto-Synced</text>

    <!-- Table Header -->
    <rect x="20" y="50" width="530" height="30" rx="6" fill="#101522" />
    <text x="35" y="70" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">TIME</text>
    <text x="105" y="70" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">PATIENT</text>
    <text x="235" y="70" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">DEPARTMENT</text>
    <text x="365" y="70" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">DOCTOR</text>
    <text x="475" y="70" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <g transform="translate(20, 90)">
      <line x1="0" y1="42" x2="530" y2="42" stroke="#1f293d" stroke-width="1" />
      <text x="15" y="25" fill="#f8fafc" font-family="monospace" font-size="12">09:30 AM</text>
      <text x="85" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Sarah Jenkins</text>
      <text x="215" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Cardiology</text>
      <text x="345" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="12">Dr. Vance</text>
      <rect x="450" y="10" width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
      <text x="463" y="25" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">In Progress</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 140)">
      <line x1="0" y1="42" x2="530" y2="42" stroke="#1f293d" stroke-width="1" />
      <text x="15" y="25" fill="#f8fafc" font-family="monospace" font-size="12">10:15 AM</text>
      <text x="85" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">David Martinez</text>
      <text x="215" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Orthopedics</text>
      <text x="345" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="12">Dr. Ellis</text>
      <rect x="450" y="10" width="70" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2" />
      <text x="466" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Confirmed</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 190)">
      <line x1="0" y1="42" x2="530" y2="42" stroke="#1f293d" stroke-width="1" />
      <text x="15" y="25" fill="#f8fafc" font-family="monospace" font-size="12">11:00 AM</text>
      <text x="85" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="500">Emma Zhao</text>
      <text x="215" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Pediatrics</text>
      <text x="345" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="12">Dr. Koyama</text>
      <rect x="450" y="10" width="70" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" />
      <text x="469" y="25" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600">Checked In</text>
    </g>
    
    <!-- Row 4 -->
    <g transform="translate(20, 240)">
      <text x="15" y="25" fill="#94a3b8" font-family="monospace" font-size="12">11:45 AM</text>
      <text x="85" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Michael Thorne</text>
      <text x="215" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Neurology</text>
      <text x="345" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Dr. Vance</text>
      <rect x="450" y="10" width="70" height="22" rx="11" fill="#64748b" fill-opacity="0.2" />
      <text x="470" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Upcoming</text>
    </g>
  </g>
</svg>
